<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的選股實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1330;--card:rgba(24,40,86,.62);--card-b:rgba(120,160,255,.16);--line:rgba(120,160,255,.14);--tx:#e9f0ff;--tx2:#c5d3f0;--mute:#93a8d2;--acc:#3ac7ff;--acc2:#7b6dff;--up:#ff6b7a;--dn:#3ddcaa;--warn:#ffc766;--glow1:rgba(58,199,255,.16);--glow2:rgba(123,109,255,.2);--sh:rgba(0,0,0,.45);--hero:linear-gradient(155deg,rgba(44,70,142,.85),rgba(22,34,78,.78));--font:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;--num:"Outfit","Noto Sans TC",-apple-system,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#eef3ff;--card:rgba(255,255,255,.82);--card-b:rgba(70,100,190,.16);--line:rgba(70,100,190,.14);--tx:#14213d;--tx2:#33466d;--mute:#5b6f93;--up:#d6293b;--dn:#0b946a;--warn:#b7791f;--glow1:rgba(58,199,255,.22);--glow2:rgba(123,109,255,.16);--sh:rgba(40,60,120,.18);--hero:linear-gradient(155deg,#fff,#e6eeff);color-scheme:light}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:16px/1.7 var(--font);padding-bottom:92px;background:radial-gradient(70% 38% at 90% -4%,var(--glow2),transparent 70%),radial-gradient(60% 30% at -5% 32%,var(--glow1),transparent 70%),var(--bg);background-repeat:no-repeat;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px}
.logo i{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;box-shadow:0 6px 18px -4px var(--acc2)}
.logo b{display:block;line-height:1.25;font-size:17px;color:var(--tx)}
.logo small{color:var(--mute);letter-spacing:.14em;font-size:10px}
.tag{border:1px solid var(--card-b);background:var(--card);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--mute)}
main{padding:18px 16px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:24px;padding:20px;margin-bottom:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 32px -16px var(--sh)}
.hero{background:var(--hero);border-radius:30px;position:relative;overflow:hidden;padding:22px}
.hero::before{content:"";position:absolute;width:280px;height:280px;right:-100px;top:-120px;background:radial-gradient(circle,var(--glow2),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.intro{background:linear-gradient(120deg,var(--glow1),var(--glow2));border-radius:26px}
h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:.01em}
h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px;color:var(--tx2);font-weight:700}
.ic{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--glow1),var(--glow2));border:1px solid var(--card-b);font-size:15px}
small,.mute{color:var(--mute);font-size:13px}
p{color:var(--tx2)}
.up{color:var(--up)}.dn{color:var(--dn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--card-b);background:var(--card);color:var(--tx2);border-radius:99px;padding:7px 16px;font:inherit;font-size:14px}
.chip.on{border-color:transparent;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-weight:700;box-shadow:0 6px 16px -6px var(--acc2)}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row small{display:block;line-height:1.4}.row b{font-weight:600}
.bd{font:600 13px var(--num);color:var(--acc);background:var(--glow1);border:1px solid var(--card-b);border-radius:10px;padding:4px 0;min-width:54px;text-align:center}
.r{text-align:right;margin-left:auto}.r b{font-family:var(--num);font-size:17px}
.pill{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-radius:99px;padding:2px 11px;font:700 13px var(--num);white-space:nowrap}
.search{display:flex;flex-direction:column;gap:12px}
input,select{width:100%;background:var(--card);border:1px solid var(--card-b);color:var(--tx);border-radius:18px;padding:15px 18px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--glow1)}
.btn{border:0;border-radius:18px;padding:15px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 10px 22px -10px var(--acc2)}
.price{font:800 50px/1.05 var(--num);letter-spacing:-.01em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:4px}
.chg{font:700 15px var(--num);padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.07)}
.chg.up{background:rgba(255,107,122,.15)}.chg.dn{background:rgba(61,220,170,.15)}
.ring{display:block;margin:12px auto 6px;filter:drop-shadow(0 0 14px var(--glow2))}
.arc{animation:draw 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes draw{from{stroke-dasharray:0 400}}
@media (prefers-reduced-motion:reduce){.arc{animation:none}}
.lv{position:relative;display:flex;justify-content:space-between;align-items:baseline;padding:11px 0 11px 16px;border-bottom:1px solid var(--line)}
.lv:last-child{border:0}
.lv::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;border-radius:4px;background:var(--mute)}
.lv.res::before{background:var(--up)}.lv.sup::before{background:var(--dn)}
.lv.now{color:var(--acc);font-weight:700}.lv.now::before{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.lv span:last-child{font-family:var(--num);font-weight:600}
.bar{position:relative;height:10px;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--warn),var(--up));margin:32px 0 10px;box-shadow:0 0 18px -4px var(--acc2)}
.bar i{position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--acc),0 0 14px var(--acc);transform:translateX(-50%)}
.bar-l{display:flex;justify-content:space-between}
ul{padding-left:18px;margin:6px 0}li{margin:7px 0;color:var(--tx2)}li::marker{color:var(--acc)}
details{border-bottom:1px solid var(--line);padding:14px 0}details:last-child{border:0;padding-bottom:2px}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--acc);font-weight:400}
details[open] summary::after{content:"－"}
details>*:not(summary){margin-top:10px}
.star{float:right;background:var(--card);border:1px solid var(--card-b);color:var(--warn);border-radius:99px;padding:3px 14px;font:inherit;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{position:relative;flex:1;background:none;border:0;color:var(--mute);padding:11px 0 8px;font:inherit;font-size:12px}
nav button span{display:block;font-size:21px;line-height:1.2}
nav button.on{color:var(--acc);font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc)}
.foot{color:var(--mute);font-size:12px;line-height:1.7;padding:8px 6px 24px}
</style>
</head>
<body>
<header>
  <div class="logo"><i>選</i><div><b>我的選股實驗室</b><small>MY STOCK LAB</small></div></div>
  <span class="tag" id="tag">示範資料</span>
</header>
<main>
  <section class="view on" id="v-home">
    <div class="card intro"><h2>選股篩選</h2><small>點選條件，快速找出符合的台股標的。</small></div>
    <div class="chips" id="chips"></div>
    <div class="card" id="list"></div>
  </section>
  <section class="view" id="v-search">
    <div class="search">
      <input id="q" placeholder="輸入股號或名稱，例如 2330" inputmode="search" autocomplete="off">
      <button class="btn" id="go">幫我看看 ✦</button>
    </div>
    <div id="res" style="margin-top:16px"></div>
  </section>
  <section class="view" id="v-watch">
    <div class="card" id="wl"></div>
  </section>
  <section class="view" id="v-pf">
    <div id="pfs"></div>
    <div class="card"><h3><i class="ic">＋</i>記一筆交易</h3><div class="search">
      <input id="tc" placeholder="股號，例如 2330" inputmode="numeric">
      <select id="tt"><option value="B">買進</option><option value="S">賣出</option></select>
      <input id="tq" type="number" inputmode="decimal" placeholder="股數（1 張＝1000 股）">
      <input id="tp" type="number" inputmode="decimal" step="any" placeholder="成交價">
      <input id="td" type="date"><button class="btn" data-act="tx">新增交易</button>
      <small>手續費 0.1425%、賣出證交稅 0.3% 會自動估算；配股可記成「價格 0 的買進」。</small></div></div>
    <div class="card"><h3><i class="ic">＄</i>資金進出</h3><div class="search">
      <select id="ct"><option value="1">入金</option><option value="-1">出金</option></select>
      <input id="ca" type="number" inputmode="decimal" placeholder="金額"><input id="cd" type="date">
      <button class="btn" data-act="cf">新增</button></div></div>
    <div class="card" id="pfl"></div>
    <div class="card"><h3><i class="ic">⇅</i>備份</h3><small>資料只存在這支手機的瀏覽器，換機或清除前請先匯出。</small>
      <div class="search" style="margin-top:10px"><input id="bk" placeholder="匯出後會顯示在這；匯入時貼在這">
      <button class="btn" data-act="exp">匯出</button><button class="btn" data-act="imp">匯入</button></div></div>
  </section>
  <section class="view" id="v-me">
    <div class="card"><h2>關於本站</h2><small>資料每個交易日收盤後自動更新，來源為證交所公開資料。若讀不到資料，頁面會改顯示內建的示範數字。</small></div>
  </section>
  <p class="foot" id="ft">本網站資訊僅供研究與資訊參考，不構成任何投資建議，請自行評估投資風險。示範頁面中的數字皆為虛構範例，並非實際行情。</p>
</main>
<nav id="nav">
  <button data-tab="home" class="on"><span>⌂</span>首頁</button>
  <button data-tab="search"><span>⌕</span>搜尋</button>
  <button data-tab="pf"><span>＄</span>持股</button>
  <button data-tab="watch"><span>☆</span>自選</button>
  <button data-tab="me"><span>☺</span>我的</button>
</nav>
<script>
let S=[
{c:"2330",n:"台積電",p:1085,ch:1.4,vr:1.12,rsi:61,ma:1042,f:8420,lo:1010,hi:1100,s:[1060,1042],r:[1100,1140],sc:[72,68,80]},
{c:"2317",n:"鴻海",p:212,ch:-0.9,vr:0.74,rsi:44,ma:218,f:-3120,lo:198,hi:236,s:[205,198],r:[222,236],sc:[48,40,52]},
{c:"2454",n:"聯發科",p:1320,ch:-2.6,vr:0.68,rsi:29,ma:1405,f:-1260,lo:1280,hi:1520,s:[1280,1240],r:[1380,1450],sc:[30,34,46]},
{c:"6139",n:"亞翔",p:636,ch:-4.36,vr:0.68,rsi:19.4,ma:711.45,f:-124,lo:633,hi:718,s:[633,623],r:[654,672],sc:[15,34,46]},
{c:"2603",n:"長榮",p:198,ch:2.8,vr:1.9,rsi:67,ma:181,f:5230,lo:165,hi:205,s:[190,181],r:[205,214],sc:[74,70,78]},
{c:"2881",n:"富邦金",p:92.4,ch:0.3,vr:0.92,rsi:52,ma:90.1,f:2110,lo:86,hi:96,s:[90.1,88],r:[94,96],sc:[58,62,55]},
{c:"2412",n:"中華電",p:128.5,ch:0.0,vr:0.7,rsi:49,ma:127.8,f:640,lo:124,hi:131,s:[127.8,126],r:[130,131],sc:[50,56,52]},
{c:"3711",n:"日月光投控",p:168,ch:1.1,vr:0.78,rsi:33,ma:172,f:1480,lo:160,hi:186,s:[164,160],r:[172,180],sc:[44,60,50]}
];
const FL=[["all","全部"],["rsi","RSI 超賣"],["vol","量能縮小"],["inst","外資買超"],["ma","站上月線"]];
const F={all:()=>1,rsi:s=>s.rsi<35,vol:s=>s.vr<0.8,inst:s=>s.f>0,ma:s=>s.p>s.ma};
let filt="all",cur=null,W=[],DATE="示範資料";
try{W=JSON.parse(localStorage.getItem("w")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const fx=n=>n.toFixed(2),sg=n=>(n>=0?"+":"")+n.toFixed(2)+"%",cl=n=>n>=0?"up":"dn";
const sc=s=>Math.round((s.sc[0]+s.sc[1]+s.sc[2])/3);
const dist=(v,p)=>sg((v/p-1)*100);
function row(s){return `<div class="row" data-c="${s.c}"><span class="bd">${s.c}</span><div><b>${s.n}</b><small>${esc(s.ind||"")}</small></div><div class="r"><b class="${cl(s.ch)}">${fx(s.p)}</b><small class="${cl(s.ch)}">${sg(s.ch)}</small></div><span class="pill">${sc(s)} 分</span></div>`}
function home(){
  $("chips").innerHTML=FL.map(f=>`<button class="chip ${f[0]===filt?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("");
  const all=S.filter(F[filt]).sort((x,y)=>sc(y)-sc(x)),a=all.slice(0,50);
  $("list").innerHTML=a.length?a.map(row).join("")+(all.length>50?`<small>共 ${all.length} 檔，僅顯示評分最高的 50 檔。</small>`:""):"<small>目前沒有符合條件的股票。</small>";
}
function watch(){
  const a=S.filter(s=>W.includes(s.c));
  $("wl").innerHTML=a.length?a.map(row).join(""):"<small>還沒有自選股，到個股頁按「☆ 加入自選」。</small>";
}
const nv=(x,d=0)=>x==null?"—":Number(x).toLocaleString(undefined,{maximumFractionDigits:d});
const sgn=x=>x==null?"—":(x>0?"+":"")+Number(x).toLocaleString();
const esc=t=>String(t).replace(/[<>&"]/g,"");
let NT={};try{NT=JSON.parse(localStorage.getItem("n")||"{}")}catch(e){}
function setNote(c,v){NT[c]=v;try{localStorage.setItem("n",JSON.stringify(NT))}catch(e){}}
function chipH(s){
  if(s.mf==null)return '<p class="mute">尚無資料。</p>';
  return `<ul><li>融資餘額 ${nv(s.mf)} 張，較前一日 ${sgn(s.mfc)} 張</li><li>融券餘額 ${nv(s.ms)} 張，較前一日 ${sgn(s.msc)} 張</li><li class="mute">借券資料本版尚未提供。</li></ul>`;
}
function fundH(s){
  const l=[];
  if(s.rev!=null)l.push(`${esc(s.ym)} 月營收 ${nv(s.rev/1e5,2)} 億元，月增 ${s.mom==null?"—":sg(s.mom)}，年增 ${s.yoy==null?"—":sg(s.yoy)}`);
  if(s.pe!=null||s.pb!=null||s.dy!=null)l.push(`本益比 ${nv(s.pe,2)}｜股價淨值比 ${nv(s.pb,2)}｜殖利率 ${nv(s.dy,2)}%`);
  return l.length?"<ul>"+l.map(x=>`<li>${x}</li>`).join("")+"</ul>":'<p class="mute">尚無資料。</p>';
}
function indH(s){
  const peers=s.ind?S.filter(x=>x.ind===s.ind&&x.c!==s.c).sort((a,b)=>sc(b)-sc(a)).slice(0,3):[];
  const nw=(s.nw||[]).map(n=>`<li>${esc(n[0])}　${esc(n[1])}</li>`).join("");
  return `<ul><li>產業別：${s.ind?esc(s.ind):"—"}</li>${peers.length?`<li>同產業評分較高：${peers.map(x=>`<span data-c="${x.c}" style="color:var(--acc);cursor:pointer">${esc(x.n)}</span>`).join("、")}</li>`:""}</ul>
  <h3 style="margin-top:12px">近期重大訊息</h3>${nw?"<ul>"+nw+"</ul>":'<p class="mute">近期沒有重大訊息。</p>'}
  <h3 style="margin-top:12px">我的題材筆記</h3><input id="note" placeholder="例如：AI 伺服器、軍工（自動儲存）" value="${esc(NT[s.c]||"")}">`;
}
function analyze(s){
  const t=sc(s),C=2*Math.PI*52,pct=Math.max(0,Math.min(100,(s.p-s.lo)/(s.hi-s.lo)*100));
  const zone=pct<33?"觀察區":pct<66?"中性區":"偏熱區";
  const lv=[["第二壓力",s.r[1]],["第一壓力",s.r[0]],["現價",s.p],["近端支撐",s.s[0]],["第二支撐",s.s[1]]].sort((a,b)=>b[1]-a[1]);
  const inW=W.includes(s.c);
  const trend=s.p>s.ma?"收盤在 20 日均線之上":"收盤低於 20 日均線 "+fx(s.ma);
  return `<div class="card hero">
  <button class="star" data-star="${s.c}">${inW?"★ 已自選":"☆ 加入自選"}</button>
  <h2>${s.n} <small>${s.c}</small></h2>
  <div class="price">${fx(s.p)} <span class="chg ${cl(s.ch)}">${sg(s.ch)}</span></div>
  <small>資料日期：${DATE}</small>
  <svg class="ring" width="150" height="150" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" class="arc" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(t/100*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" fill="var(--tx)" font-size="32" font-weight="800" style="font-family:var(--num)">${t}</text><text x="60" y="78" text-anchor="middle" fill="var(--mute)" font-size="11">量價觀察</text></svg>
  <div class="mute" style="text-align:center">趨勢 ${s.sc[0]} ｜ 法人 ${s.sc[1]} ｜ 量價 ${s.sc[2]}</div></div>
  <div class="card"><h3><i class="ic">🎯</i>價位分類</h3>${lv.map(l=>`<div class="lv ${l[0]==="現價"?"now":l[1]>s.p?"res":"sup"}"><span>${l[0]}</span><span>${fx(l[1])} <small>${l[0]==="現價"?"":dist(l[1],s.p)}</small></span></div>`).join("")}</div>
  <div class="card"><h3><i class="ic">📍</i>現在的位置</h3><h2>${s.n}現在站在哪？</h2>
  <div class="bar"><i style="left:${pct.toFixed(0)}%"></i></div><div class="bar-l mute"><span>觀察區</span><span>偏熱</span></div>
  <p>以近 20 日低點到高點區間衡量，價格位於區間約 ${pct.toFixed(0)}%（${zone}）。</p><small>僅描述價格所在位置，不代表任何買賣建議。</small></div>
  <div class="card"><h3><i class="ic">⚡</i>今天為什麼動？</h3><ul>
  <li>${s.ch>=0?"今日收紅":"今日收綠"}：收盤 ${fx(s.p)}，${sg(s.ch)}。</li>
  <li>${s.vr<1?"成交量縮小":"成交量放大"}：約為近 20 日均量的 ${s.vr} 倍。</li>
  <li>外資${s.f>=0?"買超":"賣超"}：合計 ${Math.abs(s.f).toLocaleString()} 張。</li></ul></div>
  <div class="card"><h3><i class="ic">🔬</i>研究室</h3>
  <details><summary>技術面</summary><p class="mute">RSI(14) ${s.rsi}；${trend}。</p></details>
  <details><summary>法人</summary><p class="mute">外資${s.f>=0?"買超":"賣超"} ${Math.abs(s.f).toLocaleString()} 張。</p></details>
  <details><summary>籌碼（融資融券・借券）</summary>${chipH(s)}</details>
  <details><summary>基本面・營收</summary>${fundH(s)}</details>
  <details><summary>產業・題材・公司消息</summary>${indH(s)}</details></div>`;
}
function show(tab){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+tab));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="watch")watch();if(tab==="pf")pf();window.scrollTo(0,0);
}
function open(c){
  cur=S.find(s=>s.c===c);if(!cur)return;
  $("res").innerHTML=analyze(cur);$("q").value=cur.c;show("search");
}
function find(){
  const k=$("q").value.trim();if(!k)return;
  const s=S.find(x=>x.c===k||x.n.includes(k));
  if(s)open(s.c);else $("res").innerHTML='<div class="card"><small>找不到「'+k.replace(/[<>&]/g,"")+'」，目前只收錄上市股票。</small></div>';
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-c],[data-f],[data-tab],[data-star]");if(!t)return;
  if(t.dataset.c)open(t.dataset.c);
  else if(t.dataset.f){filt=t.dataset.f;home()}
  else if(t.dataset.tab)show(t.dataset.tab);
  else if(t.dataset.star){
    const c=t.dataset.star;W=W.includes(c)?W.filter(x=>x!==c):W.concat(c);
    try{localStorage.setItem("w",JSON.stringify(W))}catch(err){}
    if(cur)$("res").innerHTML=analyze(cur);
  }
});
$("go").addEventListener("click",find);
document.addEventListener("input",e=>{if(e.target.id==="note"&&cur)setNote(cur.c,e.target.value)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")find()});

let PF={tx:[],cf:[]},DV={};
try{PF=Object.assign(PF,JSON.parse(localStorage.getItem("pf")||"{}"))}catch(e){}
const savePF=()=>{try{localStorage.setItem("pf",JSON.stringify(PF))}catch(e){}};
const today=()=>new Date(Date.now()+288e5).toISOString().slice(0,10);
const fee=(t)=>Math.round(t.q*t.p*0.001425)+(t.t==="S"?Math.round(t.q*t.p*0.003):0);
function calc(){
  const T=PF.tx.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),pos={},dl=[];
  let cash=0,real=0,div=0,inflow=0;
  PF.cf.forEach(x=>{cash+=x.a;inflow+=x.a});
  T.forEach(t=>{const o=pos[t.c]||(pos[t.c]={q:0,cost:0}),f=fee(t);
    if(t.t==="B"){o.q+=t.q;o.cost+=t.q*t.p+f;cash-=t.q*t.p+f}
    else{const avg=o.q?o.cost/o.q:0,net=t.q*t.p-f;real+=net-avg*t.q;o.cost-=avg*t.q;o.q-=t.q;cash+=net}});
  Object.keys(pos).forEach(c=>(DV[c]||[]).forEach(([ex,cs])=>{
    if(ex>today())return;
    const held=T.filter(t=>t.c===c&&t.d<ex).reduce((a,t)=>a+(t.t==="B"?t.q:-t.q),0);
    if(held>0){const amt=Math.floor(held*cs);div+=amt;cash+=amt;dl.push({c,ex,held,cs,amt})}}));
  let mv=0,unr=0;
  const list=Object.keys(pos).filter(c=>pos[c].q>0).map(c=>{
    const o=pos[c],s=S.find(x=>x.c===c),p=s?s.p:null,v=p==null?null:p*o.q;
    if(v!=null){mv+=v;unr+=v-o.cost}return{c,n:s?s.n:c,q:o.q,avg:o.cost/o.q,p,v,pl:v==null?null:v-o.cost}});
  return{cash,real,div,mv,unr,inflow,list,dl,T};
}
const money=x=>(x<0?"-":"")+Math.abs(Math.round(x)).toLocaleString();
const pc=x=>`<span class="${x>=0?"up":"dn"}">${x>0?"+":""}${money(x)}</span>`;
function pf(){
  const r=calc(),tot=r.cash+r.mv,all=r.unr+r.real+r.div;
  $("pfs").innerHTML=`<div class="card hero"><small>總資產（現金＋持股市值）</small><div class="price">${money(tot)}</div>
  <ul><li>現金 ${money(r.cash)}　持股市值 ${money(r.mv)}</li><li>未實現損益 ${pc(r.unr)}</li><li>已實現損益 ${pc(r.real)}</li><li>累計配息 ${pc(r.div)}</li>
  <li>合計損益 ${pc(all)}　淨投入資金 ${money(r.inflow)}</li></ul></div>`;
  const rows=r.list.map(x=>`<div class="row" data-c="${x.c}"><span class="bd">${x.c}</span><div><b>${esc(x.n)}</b><small>${nv(x.q)} 股 ｜ 均價 ${fx(x.avg)}</small></div><div class="r"><b>${x.p==null?"—":fx(x.p)}</b><small>${x.pl==null?"":pc(x.pl)}</small></div></div>`).join("");
  const dv=r.dl.slice().reverse().map(x=>`<li>${x.ex} ${x.c}：${nv(x.held)} 股 × ${x.cs} ＝ ${money(x.amt)}</li>`).join("");
  const rec=[...PF.tx.map((t,i)=>({d:t.d,k:"tx",i,s:`${t.t==="B"?"買":"賣"} ${t.c} ${nv(t.q)} 股 @ ${t.p}`})),...PF.cf.map((x,i)=>({d:x.d,k:"cf",i,s:`${x.a>0?"入金":"出金"} ${money(Math.abs(x.a))}`}))].sort((a,b)=>a.d<b.d?1:-1).slice(0,30)
    .map(x=>`<li>${x.d} ${esc(x.s)} <a data-act="del" data-k="${x.k}" data-i="${x.i}" style="color:var(--acc);cursor:pointer">刪除</a></li>`).join("");
  $("pfl").innerHTML=`<h3><i class="ic">▤</i>目前持股</h3>${rows||'<small>還沒有持股。</small>'}
  <h3 style="margin-top:16px"><i class="ic">％</i>配息（依除權息日持有股數自動計算）</h3>${dv?"<ul>"+dv+"</ul>":'<small>尚無已除息的配息紀錄。</small>'}
  <small>以除息日計入現金，實際入帳日通常晚幾週；未計二代健保補充保費與配股。</small>
  <h3 style="margin-top:16px"><i class="ic">☰</i>最近紀錄</h3>${rec?"<ul>"+rec+"</ul>":'<small>無。</small>'}`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="tx"){const c=$("tc").value.trim(),q=+$("tq").value,p=+$("tp").value,d=$("td").value||today();
    if(!/^\d{4}$/.test(c)||!(q>0)||!(p>=0))return alert("請填股號（4 碼）、股數、價格");
    PF.tx.push({c,t:$("tt").value,q,p,d});}
  else if(a==="cf"){const v=+$("ca").value;if(!(v>0))return alert("請填金額");PF.cf.push({a:v*$("ct").value,d:$("cd").value||today()});}
  else if(a==="del"){PF[t.dataset.k].splice(+t.dataset.i,1)}
  else if(a==="exp"){$("bk").value=JSON.stringify(PF);return}
  else if(a==="imp"){try{const j=JSON.parse($("bk").value);PF={tx:j.tx||[],cf:j.cf||[]}}catch(err){return alert("格式不正確")}}
  savePF();pf();
});
fetch("data/dividends.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{DV=j;pf()}).catch(()=>{});
home();
fetch("data/screen.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  if(!j.stocks||!j.stocks.length)return;
  S=j.stocks;DATE=j.date;$("tag").textContent="資料日期 "+j.date;
  $("ft").textContent="本網站為個人使用的資料整理，不構成任何投資建議。資料來源為臺灣證券交易所公開資料，為收盤資料，非即時報價。";
  home();watch();pf();
}).catch(()=>{});
</script>
