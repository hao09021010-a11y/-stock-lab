<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的選股實驗室</title>
<style>
:root{--bg:#0a1730;--card:#112448;--card2:#162d57;--line:#24427a;--tx:#e8f0ff;--mute:#8aa3cf;--acc:#2bb8ff;--acc2:#6a5cff;--up:#ff5d6c;--dn:#2fd39b;--warn:#ffb84a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fb;--card:#fff;--card2:#f1f5fc;--line:#cdd9ee;--tx:#14213d;--mute:#5b6f93;--up:#d6293b;--dn:#0c9a6b;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0a1730;--card:#112448;--card2:#162d57;--line:#24427a;--tx:#e8f0ff;--mute:#8aa3cf}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff}
.logo b{display:block;line-height:1.2}.logo small{color:var(--mute);letter-spacing:.15em;font-size:10px}
.tag{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--mute)}
main{padding:16px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:20px}h3{margin:0 0 10px;font-size:15px;color:var(--mute);font-weight:600}
small,.mute{color:var(--mute);font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px}
.chip.on{border-color:var(--acc);color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row small{display:block}.r{text-align:right;margin-left:auto}
.pill{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.search{display:flex;flex-direction:column;gap:10px}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:16px;padding:14px 16px;font:inherit}
.btn{border:0;border-radius:16px;padding:14px;font:inherit;font-weight:800;color:#06142e;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.price{font-size:44px;font-weight:800;line-height:1.1}
.ring{display:block;margin:10px auto}
.lv{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.lv:last-child{border:0}.lv.now{color:var(--acc);font-weight:700}
.bar{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--warn),var(--up));margin:26px 0 8px}
.bar i{position:absolute;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);transform:translateX(-50%)}
.bar-l{display:flex;justify-content:space-between}
ul{padding-left:20px;margin:6px 0}li{margin:6px 0}
details{border-bottom:1px solid var(--line);padding:12px 0}details:last-child{border:0}
summary{font-weight:700;cursor:pointer}
.star{float:right;background:none;border:1px solid var(--line);color:var(--warn);border-radius:99px;padding:2px 12px;font:inherit;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0 8px;font:inherit;font-size:12px}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--acc)}
.foot{color:var(--mute);font-size:12px;padding:8px 4px 24px}
</style>
</head>
<body>
<header>
  <div class="logo"><i>選</i><div><b>我的選股實驗室</b><small>MY STOCK LAB</small></div></div>
  <span class="tag" id="tag">示範資料</span>
</header>
<main>
  <section class="view on" id="v-home">
    <div class="card"><h2>選股篩選</h2><small>點選條件，快速找出符合的台股標的。</small></div>
    <div class="chips" id="chips"></div>
    <div class="card" id="list"></div>
  </section>
  <section class="view" id="v-search">
    <div class="search">
      <input id="q" placeholder="輸入股號或名稱，例如 2330" inputmode="search" autocomplete="off">
      <button class="btn" id="go">幫我看看 ✦</button>
    </div>
    <div id="res" style="margin-top:16px"></div>
  </section>
  <section class="view" id="v-watch">
    <div class="card" id="wl"></div>
  </section>
  <section class="view" id="v-me">
    <div class="card"><h2>關於本站</h2><small>資料每個交易日收盤後自動更新，來源為證交所公開資料。若讀不到資料，頁面會改顯示內建的示範數字。</small></div>
  </section>
  <p class="foot" id="ft">本網站資訊僅供研究與資訊參考，不構成任何投資建議，請自行評估投資風險。示範頁面中的數字皆為虛構範例，並非實際行情。</p>
</main>
<nav id="nav">
  <button data-tab="home" class="on"><span>⌂</span>首頁</button>
  <button data-tab="search"><span>⌕</span>搜尋</button>
  <button data-tab="watch"><span>☆</span>自選</button>
  <button data-tab="me"><span>☺</span>我的</button>
</nav>
<script>
let S=[
{c:"2330",n:"台積電",p:1085,ch:1.4,vr:1.12,rsi:61,ma:1042,f:8420,lo:1010,hi:1100,s:[1060,1042],r:[1100,1140],sc:[72,68,80]},
{c:"2317",n:"鴻海",p:212,ch:-0.9,vr:0.74,rsi:44,ma:218,f:-3120,lo:198,hi:236,s:[205,198],r:[222,236],sc:[48,40,52]},
{c:"2454",n:"聯發科",p:1320,ch:-2.6,vr:0.68,rsi:29,ma:1405,f:-1260,lo:1280,hi:1520,s:[1280,1240],r:[1380,1450],sc:[30,34,46]},
{c:"6139",n:"亞翔",p:636,ch:-4.36,vr:0.68,rsi:19.4,ma:711.45,f:-124,lo:633,hi:718,s:[633,623],r:[654,672],sc:[15,34,46]},
{c:"2603",n:"長榮",p:198,ch:2.8,vr:1.9,rsi:67,ma:181,f:5230,lo:165,hi:205,s:[190,181],r:[205,214],sc:[74,70,78]},
{c:"2881",n:"富邦金",p:92.4,ch:0.3,vr:0.92,rsi:52,ma:90.1,f:2110,lo:86,hi:96,s:[90.1,88],r:[94,96],sc:[58,62,55]},
{c:"2412",n:"中華電",p:128.5,ch:0.0,vr:0.7,rsi:49,ma:127.8,f:640,lo:124,hi:131,s:[127.8,126],r:[130,131],sc:[50,56,52]},
{c:"3711",n:"日月光投控",p:168,ch:1.1,vr:0.78,rsi:33,ma:172,f:1480,lo:160,hi:186,s:[164,160],r:[172,180],sc:[44,60,50]}
];
const FL=[["all","全部"],["rsi","RSI 超賣"],["vol","量能縮小"],["inst","外資買超"],["ma","站上月線"]];
const F={all:()=>1,rsi:s=>s.rsi<35,vol:s=>s.vr<0.8,inst:s=>s.f>0,ma:s=>s.p>s.ma};
let filt="all",cur=null,W=[],DATE="示範資料";
try{W=JSON.parse(localStorage.getItem("w")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const fx=n=>n.toFixed(2),sg=n=>(n>=0?"+":"")+n.toFixed(2)+"%",cl=n=>n>=0?"up":"dn";
const sc=s=>Math.round((s.sc[0]+s.sc[1]+s.sc[2])/3);
const dist=(v,p)=>sg((v/p-1)*100);
function row(s){return `<div class="row" data-c="${s.c}"><div><b>${s.n}</b><small>${s.c}</small></div><div class="r"><b class="${cl(s.ch)}">${fx(s.p)}</b><small class="${cl(s.ch)}">${sg(s.ch)}</small></div><span class="pill">${sc(s)} 分</span></div>`}
function home(){
  $("chips").innerHTML=FL.map(f=>`<button class="chip ${f[0]===filt?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("");
  const all=S.filter(F[filt]).sort((x,y)=>sc(y)-sc(x)),a=all.slice(0,50);
  $("list").innerHTML=a.length?a.map(row).join("")+(all.length>50?`<small>共 ${all.length} 檔，僅顯示評分最高的 50 檔。</small>`:""):"<small>目前沒有符合條件的股票。</small>";
}
function watch(){
  const a=S.filter(s=>W.includes(s.c));
  $("wl").innerHTML=a.length?a.map(row).join(""):"<small>還沒有自選股，到個股頁按「☆ 加入自選」。</small>";
}
function analyze(s){
  const t=sc(s),C=2*Math.PI*52,pct=Math.max(0,Math.min(100,(s.p-s.lo)/(s.hi-s.lo)*100));
  const zone=pct<33?"觀察區":pct<66?"中性區":"偏熱區";
  const lv=[["第二壓力",s.r[1]],["第一壓力",s.r[0]],["現價",s.p],["近端支撐",s.s[0]],["第二支撐",s.s[1]]].sort((a,b)=>b[1]-a[1]);
  const inW=W.includes(s.c);
  const trend=s.p>s.ma?"收盤在 20 日均線之上":"收盤低於 20 日均線 "+fx(s.ma);
  return `<div class="card">
  <button class="star" data-star="${s.c}">${inW?"★ 已自選":"☆ 加入自選"}</button>
  <h2>${s.n} <small>${s.c}</small></h2>
  <div class="price">${fx(s.p)} <span class="${cl(s.ch)}" style="font-size:18px">${sg(s.ch)}</span></div>
  <small>資料日期：${DATE}</small>
  <svg class="ring" width="140" height="140" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--acc2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(t/100*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" fill="var(--tx)" font-size="30" font-weight="800">${t}</text><text x="60" y="78" text-anchor="middle" fill="var(--mute)" font-size="11">量價觀察</text></svg>
  <div class="mute" style="text-align:center">趨勢 ${s.sc[0]} ｜ 法人 ${s.sc[1]} ｜ 量價 ${s.sc[2]}</div></div>
  <div class="card"><h3>價位分類</h3>${lv.map(l=>`<div class="lv ${l[0]==="現價"?"now":""}"><span>${l[0]}</span><span>${fx(l[1])} <small>${l[0]==="現價"?"":dist(l[1],s.p)}</small></span></div>`).join("")}</div>
  <div class="card"><h3>現在的位置</h3><h2>${s.n}現在站在哪？</h2>
  <div class="bar"><i style="left:${pct.toFixed(0)}%"></i></div><div class="bar-l mute"><span>觀察區</span><span>偏熱</span></div>
  <p>以近 20 日低點到高點區間衡量，價格位於區間約 ${pct.toFixed(0)}%（${zone}）。</p><small>僅描述價格所在位置，不代表任何買賣建議。</small></div>
  <div class="card"><h3>今天為什麼動？</h3><ul>
  <li>${s.ch>=0?"今日收紅":"今日收綠"}：收盤 ${fx(s.p)}，${sg(s.ch)}。</li>
  <li>${s.vr<1?"成交量縮小":"成交量放大"}：約為近 20 日均量的 ${s.vr} 倍。</li>
  <li>外資${s.f>=0?"買超":"賣超"}：合計 ${Math.abs(s.f).toLocaleString()} 張。</li></ul></div>
  <div class="card"><h3>研究室</h3>
  <details><summary>技術面</summary><p class="mute">RSI(14) ${s.rsi}；${trend}。</p></details>
  <details><summary>法人</summary><p class="mute">外資${s.f>=0?"買超":"賣超"} ${Math.abs(s.f).toLocaleString()} 張。</p></details>
  <details><summary>籌碼（融資融券・借券）</summary><p class="mute">待串接資料來源後顯示。</p></details>
  <details><summary>基本面・營收</summary><p class="mute">待串接資料來源後顯示。</p></details>
  <details><summary>產業・題材・公司消息</summary><p class="mute">待串接資料來源後顯示。</p></details></div>`;
}
function show(tab){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+tab));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="watch")watch();window.scrollTo(0,0);
}
function open(c){
  cur=S.find(s=>s.c===c);if(!cur)return;
  $("res").innerHTML=analyze(cur);$("q").value=cur.c;show("search");
}
function find(){
  const k=$("q").value.trim();if(!k)return;
  const s=S.find(x=>x.c===k||x.n.includes(k));
  if(s)open(s.c);else $("res").innerHTML='<div class="card"><small>找不到「'+k.replace(/[<>&]/g,"")+'」，目前只收錄上市股票。</small></div>';
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-c],[data-f],[data-tab],[data-star]");if(!t)return;
  if(t.dataset.c)open(t.dataset.c);
  else if(t.dataset.f){filt=t.dataset.f;home()}
  else if(t.dataset.tab)show(t.dataset.tab);
  else if(t.dataset.star){
    const c=t.dataset.star;W=W.includes(c)?W.filter(x=>x!==c):W.concat(c);
    try{localStorage.setItem("w",JSON.stringify(W))}catch(err){}
    if(cur)$("res").innerHTML=analyze(cur);
  }
});
$("go").addEventListener("click",find);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")find()});
home();
fetch("data/screen.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  if(!j.stocks||!j.stocks.length)return;
  S=j.stocks;DATE=j.date;$("tag").textContent="資料日期 "+j.date;
  $("ft").textContent="本網站為個人使用的資料整理，不構成任何投資建議。資料來源為臺灣證券交易所公開資料，為收盤資料，非即時報價。";
  home();watch();
}).catch(()=>{});
</script>
</body>
</html>
